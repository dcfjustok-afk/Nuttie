map $http_x_forwarded_proto $nuttie_forwarded_proto {
  default $scheme;
  "~*^https$" https;
  "~*^http$" http;
}

map "${ENABLE_HSTS}" $nuttie_hsts {
  default "";
  "true" "max-age=31536000; includeSubDomains";
}

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 256k;
  client_body_timeout 10s;
  send_timeout 30s;

  include /etc/nginx/snippets/nuttie-security-headers.conf;

  # The web container can be health-checked without depending on the API.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /api {
    return 308 /api/;
  }

  # Keep browser traffic same-origin. The upstream is private in Compose/Zeabur.
  location ^~ /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $nuttie_forwarded_proto;
    # Browser and native clients use the same public gateway. Preserve the
    # explicit platform marker so the API can choose cookie vs body sessions.
    proxy_set_header X-Client-Platform $http_x_client_platform;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_set_header Connection "";
  }

  # Only Expo's content-hashed assets are immutable. Stable entrypoints and
  # the favicon must be revalidated after a deployment.
  location ^~ /_expo/static/ {
    try_files $uri =404;
    include /etc/nginx/snippets/nuttie-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /favicon.svg {
    try_files $uri =404;
    include /etc/nginx/snippets/nuttie-security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /index.html {
    try_files $uri =404;
    include /etc/nginx/snippets/nuttie-security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Never let the SPA fallback make hidden files look like valid application
  # pages. Keep the reserved ACME/.well-known namespace available for future
  # platform integrations while denying dotfiles everywhere else.
  location ~ (^|/)\.(?!well-known(?:/|$)) {
    return 404;
  }

  # Expo Router static output needs an SPA fallback for deep links.
  location / {
    try_files $uri $uri.html $uri/ $uri/index.html /index.html;
    include /etc/nginx/snippets/nuttie-security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
