name: nuttie

# This stack is for local development and acceptance only. Production uses
# separately managed Zeabur services and a private PostgreSQL connection.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nuttie}
      POSTGRES_USER: ${POSTGRES_USER:-nuttie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuttie_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - data
    volumes:
      - nuttie-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 8787
      ALLOW_IN_MEMORY: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-nuttie}:${POSTGRES_PASSWORD:-nuttie_dev_password}@postgres:5432/${POSTGRES_DB:-nuttie}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-local-development-access-token-secret-change-me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4187,http://localhost:8081,http://localhost:19006}
    ports:
      - "127.0.0.1:${API_PORT:-8787}:8787"
    expose:
      - "8787"
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8787/ready'').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      start_period: 75s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      PORT: 8080
      API_UPSTREAM: http://api:8787
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
    ports:
      - "127.0.0.1:${WEB_PORT:-4187}:8080"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  nuttie-postgres-data:

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
