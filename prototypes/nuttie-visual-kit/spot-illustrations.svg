<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Nuttie spot illustrations</title>
  <desc id="desc">A reusable set of flat line illustrations for meal, water, weight, movement, barcode, AI, growth, backup and reminder states.</desc>
  <defs>
    <style>
      .ink{fill:#262721}.paper{fill:#fffdf8}.cream{fill:#f5f1e9}.shell{fill:#a85d3f}.leaf{fill:#3e7a58}.amber{fill:#e1a54d}.sky{fill:#4d87a5}.line{stroke:#262721;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#262721;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="720" rx="36" fill="#f5f1e9"/>
  <g id="spot-meal" transform="translate(40 40)"><circle cx="120" cy="120" r="90" class="paper line"/><path d="M55 106h130c-5 54-33 82-65 82s-60-28-65-82Z" class="amber line"/><path d="M71 106c11-33 29-49 49-49s38 16 49 49" class="leaf line" fill="none"/><path d="M94 78c10-13 21-20 31-20M146 78c-10-13-21-20-31-20" class="thin" fill="none"/><path d="M42 78h-18v80M198 78h18v80" class="line" fill="none"/></g>
