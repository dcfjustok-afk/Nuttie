  <g id="spot-weight" transform="translate(520 40)"><circle cx="120" cy="120" r="90" class="paper line"/><rect x="61" y="68" width="118" height="104" rx="18" class="cream line"/><path d="M90 124c17-27 43-36 60-24" class="leaf line" fill="none"/><circle cx="120" cy="102" r="8" class="amber"/><path d="M88 146h64" class="thin" fill="none"/></g>
  <g id="spot-movement" transform="translate(760 40)"><circle cx="120" cy="120" r="90" class="paper line"/><path d="M76 133c18-43 37-60 56-60 22 0 34 26 51 54" class="shell line" fill="none"/><path d="m86 107 18-29 20 19M160 153l28-24 8 31" class="leaf line" fill="none"/><path d="M64 166h112" class="thin" fill="none"/></g>
  <g id="spot-barcode" transform="translate(1000 40)"><circle cx="120" cy="120" r="90" class="paper line"/><path d="M73 77v86M88 77v86M101 77v86M125 77v86M140 77v86M160 77v86" class="line"/><path d="M61 178h118" class="thin" fill="none"/></g>
  <g id="spot-ai-lens" transform="translate(160 310)"><circle cx="120" cy="120" r="90" class="paper line"/><circle cx="120" cy="120" r="42" class="sky line"/><circle cx="120" cy="120" r="14" class="paper line"/><path d="M120 55v-19M120 204v-19M55 120H36M204 120h-19" class="amber line" fill="none"/><path d="m171 70 14-14M69 170l14-14" class="leaf line" fill="none"/></g>
  <g id="spot-trend-sprout" transform="translate(400 310)"><circle cx="120" cy="120" r="90" class="paper line"/><path d="M120 166V94" class="line" fill="none"/><path d="M120 113c-35-10-50-31-45-53 27 3 44 20 45 53ZM121 138c35-10 50-31 45-53-27 3-44 20-45 53Z" class="leaf line"/><path d="M73 170h94" class="amber line" fill="none"/></g>
