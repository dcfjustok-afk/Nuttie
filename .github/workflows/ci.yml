name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Compose manifest
        run: docker compose config
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build packages, web export, and API
        run: pnpm build

  docker:
    name: Build Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build --file "Dockerfile.${{ matrix.service }}" --tag "nuttie-${{ matrix.service }}:${{ github.sha }}" .

  deployment-gate:
    name: Deployment gate
    if: ${{ always() }}
    needs: [verify, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require verification and image builds
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ] || [ "$DOCKER_RESULT" != "success" ]; then
            echo "CI did not produce a deployable revision. verify=$VERIFY_RESULT docker=$DOCKER_RESULT"
            exit 1
          fi
          echo "Typechecks, tests, builds, and both production images passed."
